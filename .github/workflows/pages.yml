name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, 'claude/admiring-meitner-ms7zj7']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site
          cp -r index.html styles.css manifest.webmanifest sw.js .nojekyll js vendor icons _site/
          # bust the service-worker cache on every deploy
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/" _site/sw.js

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy ${{ github.sha }}"
