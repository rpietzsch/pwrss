name = "pwrss-proxy"
main = "feedly-proxy.mjs"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGINS = "https://rpietzsch.github.io,http://localhost:8080"
# Set a secret key with:  npx wrangler secret put PROXY_KEY

# Cross-device sync: a Durable Object with SQLite storage. Nothing to create by hand; this deploys it.
[[durable_objects.bindings]]
name = "SYNC"
class_name = "SyncStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncStore"]
